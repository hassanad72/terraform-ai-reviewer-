name: Build and push docker image

on:
  push: 
    branches:
      - main
      - ai-risk-scoring

permissions:
  id-token: write 
  contents: read

jobs:
  docker-Build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: Configure aws credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::505342848876:role/github-actions-tf
          aws-region: us-east-1

      - name: login to ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build docker image
        run: |
          IMAGE_URI=505342848876.dkr.ecr.us-east-1.amazonaws.com/terraform-ai-reviewer:${{ github.sha}}
          docker build -t terraform-ai-reviewer .
          docker tag terraform-ai-reviewer:latest $IMAGE_URI
         

      - name: Push image to ecr
        run: |
          IMAGE_URI=505342848876.dkr.ecr.us-east-1.amazonaws.com/terraform-ai-reviewer:${{ github.sha}}
          docker push $IMAGE_URI

      - name: update kubeconfig
        run: |
          aws eks update-kubeconfig --region us-east-1 --name ai-reviewer-cluster

      - name: deploy to eks
        run: |
          kubectl delete job terraform-ai-reviewer-job --ignore-not-found
          kubectl create job terraform-ai-reviewer-job \
            --image=505342848876.dkr.ecr.us-east-1.amazonaws.com/terraform-ai-reviewer:${{ github.sha }} \
            --restart=Never