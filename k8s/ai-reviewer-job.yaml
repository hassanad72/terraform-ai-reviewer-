apiVersion: batch/v1
kind: Job
metadata:
  name: terraform-ai-reviewer-job
spec:
  template:
    spec:
      containers:
      - name: ai-reviewer
        image: IMAGE_PLACEHOLDER
        env:
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: openai-api-key
              key: OPENAI_API_KEY
        - name: S3_PLAN_PATH
          value: "S3_PLAN_PATH_PLACEHOLDER"
        - name: AWS_DEFAULT_REGION
          value: "us-east-1"
      restartPolicy: Never
  backoffLimit: 4 