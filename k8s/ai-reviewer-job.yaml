apiVersion: batch/v1
kind: Job
metadata:
  name: ai-reviewer-job
spec:
  template:
    spec:
      containers:
      - name: ai-reviewer
        image: 505342848876.dkr.ecr.us-east-1.amazonaws.com/terraform-ai-reviewer:latest
        env:
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: openai-api-key
              key: OPENAI_API_KEY
      restartPolicy: Never
  backoffLimit: 4 